<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1180" viewBox="0 0 2000 1180" role="img" aria-labelledby="title desc">
  <title id="title">Fold-specific bi-planar X-ray-to-3D reconstruction modelling architecture</title>
  <desc id="desc">A four-phase scientific architecture diagram showing fold-specific encoder development, formation of a shared bi-planar front end, a controlled factorial decoder comparison, and paired out-of-fold evaluation.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526078"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2474a8"/>
    </marker>
    <style>
      .title{font:700 34px Arial,Helvetica,sans-serif;fill:#172033}
      .subtitle{font:400 18px Arial,Helvetica,sans-serif;fill:#526078}
      .phaseNo{font:700 16px Arial,Helvetica,sans-serif;letter-spacing:1.5px;fill:#ffffff}
      .phaseTitle{font:700 23px Arial,Helvetica,sans-serif;fill:#ffffff}
      .phaseSub{font:400 15px Arial,Helvetica,sans-serif;fill:#eaf3fa}
      .boxTitle{font:700 18px Arial,Helvetica,sans-serif;fill:#172033}
      .boxText{font:400 15px Arial,Helvetica,sans-serif;fill:#45536a}
      .small{font:400 13px Arial,Helvetica,sans-serif;fill:#526078}
      .smallBold{font:700 13px Arial,Helvetica,sans-serif;fill:#334158}
      .protocolTitle{font:700 16px Arial,Helvetica,sans-serif;fill:#172033}
      .protocolText{font:400 14px Arial,Helvetica,sans-serif;fill:#45536a}
      .output{font:700 14px Arial,Helvetica,sans-serif;fill:#294358}
      .node{fill:#ffffff;stroke:#cfd8e5;stroke-width:1.5}
      .arrow{fill:none;stroke:#526078;stroke-width:2.2;marker-end:url(#arrow)}
      .arrowBlue{fill:none;stroke:#2474a8;stroke-width:2.4;marker-end:url(#arrowBlue)}
      .dash{fill:none;stroke:#7c8aa0;stroke-width:1.8;stroke-dasharray:7 6}
    </style>
  </defs>

  <rect width="2000" height="1180" fill="#f7f9fc"/>

  <text class="title" x="70" y="52">Fold-specific bi-planar X-ray-to-3D reconstruction modelling architecture</text>
  <text class="subtitle" x="70" y="82">Leakage-safe representation learning, a shared LPS-aligned front end, controlled decoder ablation, and paired evaluation</text>

 <!-- Experimental protocol strip -->
<rect x="70" y="112" width="1860" height="130" rx="18"
      fill="#ffffff" stroke="#d5deea" stroke-width="1.5"
      filter="url(#shadow)"/>

<text class="smallBold" x="96" y="140">
  EXPERIMENTAL PROTOCOL
</text>

<!-- 1. Bi-planar inputs -->
<rect x="96" y="154" width="300" height="66" rx="12"
      fill="#eef6fb" stroke="#b9d5e8"/>

<text class="protocolTitle" x="246" y="178" text-anchor="middle">
  Bi-planar inputs
</text>

<text class="protocolText" x="246" y="202" text-anchor="middle">
  Paired 256 × 256 AP and LAT DRRs
</text>

<!-- Arrow 1 -->
<path class="arrow" d="M396 187 H448"/>


<!-- 2. Five-fold split -->
<rect x="450" y="154" width="410" height="66" rx="12"
      fill="#f3f0fa" stroke="#cdc3e4"/>

<text class="protocolTitle" x="655" y="178" text-anchor="middle">
  Subject-isolated five-fold split
</text>

<text class="protocolText" x="655" y="202" text-anchor="middle">
  Test f · validation f+1 · training remaining folds
</text>

<!-- Arrow 2 -->
<path class="arrow" d="M860 187 H912"/>


<!-- 3. Four-channel targets -->
<rect x="914" y="154" width="390" height="66" rx="12"
      fill="#eef8f3" stroke="#bcdcca"/>

<text class="protocolTitle" x="1109" y="178" text-anchor="middle">
  Four-channel 3D targets
</text>

<text class="protocolText" x="1109" y="202" text-anchor="middle">
  Femur · tibia · patella · fibula channels
</text>

<!-- Arrow 3 -->
<path class="arrow" d="M1304 187 H1356"/>


<!-- 4. Online augmentation -->
<rect x="1358" y="154" width="546" height="66" rx="12"
      fill="#fff7e9" stroke="#ead3a4"/>

<text class="protocolTitle" x="1631" y="178" text-anchor="middle">
  Online data augemntation
</text>

<text class="protocolText" x="1631" y="202" text-anchor="middle">
  Mild gamma, brightness and noise; calibrated geometry preserved
</text>

  <!-- Phase panels -->
  <rect x="70" y="275" width="430" height="820" rx="20" fill="#eef6fb" stroke="#b9d5e8" stroke-width="1.5"/>
  <rect x="520" y="275" width="430" height="820" rx="20" fill="#eef3fa" stroke="#b8cbe1" stroke-width="1.5"/>
  <rect x="970" y="275" width="430" height="820" rx="20" fill="#f3f0fa" stroke="#cdc3e4" stroke-width="1.5"/>
  <rect x="1420" y="275" width="510" height="820" rx="20" fill="#eef8f3" stroke="#bcdcca" stroke-width="1.5"/>

  <!-- Phase headers -->
  <path d="M70 295 Q70 275 90 275 H480 Q500 275 500 295 V365 H70 Z" fill="#2474a8"/>
  <text class="phaseNo" x="96" y="309">PHASE I</text>
  <text class="phaseTitle" x="96" y="337">Fold-specific encoder development</text>
  <text class="phaseSub" x="96" y="358">Repeated independently within every fold</text>

  <path d="M520 295 Q520 275 540 275 H930 Q950 275 950 295 V365 H520 Z" fill="#376e9e"/>
  <text class="phaseNo" x="546" y="309">PHASE II</text>
  <text class="phaseTitle" x="546" y="337">Shared bi-planar front end</text>
  <text class="phaseSub" x="546" y="358">Supervised adaptation and 2D-to-3D lifting</text>

  <path d="M970 295 Q970 275 990 275 H1380 Q1400 275 1400 295 V365 H970 Z" fill="#68528f"/>
  <text class="phaseNo" x="996" y="309">PHASE III</text>
  <text class="phaseTitle" x="996" y="337">Factorial decoder comparison</text>
  <text class="phaseSub" x="996" y="358">Topology and activation separated experimentally</text>

  <path d="M1420 295 Q1420 275 1440 275 H1910 Q1930 275 1930 295 V365 H1420 Z" fill="#377a5b"/>
  <text class="phaseNo" x="1446" y="309">PHASE IV</text>
  <text class="phaseTitle" x="1446" y="337">Decoder optimisation and evaluation</text>
  <text class="phaseSub" x="1446" y="358">Matched training and paired out-of-fold inference</text>

  <!-- Phase I -->
  <rect class="node" x="96" y="390" width="378" height="82" rx="13"/>
  <text class="boxTitle" x="116" y="420">Fold-specific ConvNeXtV2-Tiny</text>
  <text class="boxText" x="116" y="446">Initialised from the pinned FCMAE checkpoint</text>

  <path class="arrowBlue" d="M285 472 V500"/>

  <rect class="node" x="96" y="502" width="378" height="112" rx="13"/>
  <rect x="112" y="518" width="48" height="26" rx="13" fill="#d7ebf7"/>
  <text class="smallBold" x="136" y="536" text-anchor="middle">P1</text>
  <text class="boxTitle" x="174" y="539">Masked projection learning</text>
  <text class="boxText" x="116" y="568">60% FCMAE masking on individual DRRs</text>
  <text class="small" x="116" y="592">Projection-domain adaptation without 3D targets</text>

  <path class="arrowBlue" d="M285 614 V642"/>

  <rect class="node" x="96" y="644" width="378" height="122" rx="13"/>
  <rect x="112" y="660" width="48" height="26" rx="13" fill="#d7ebf7"/>
  <text class="smallBold" x="136" y="678" text-anchor="middle">P2</text>
  <text class="boxTitle" x="174" y="681">Bidirectional view completion</text>
  <text class="boxText" x="116" y="710">AP → LAT and LAT → AP completion</text>
  <text class="small" x="116" y="734">FCMAE reconstruction objective retained</text>
  <text class="small" x="116" y="754">Encodes complementary cross-view information</text>

  <path class="arrowBlue" d="M285 766 V794"/>

  <rect class="node" x="96" y="796" width="378" height="108" rx="13"/>
  <text class="boxTitle" x="116" y="826">Frozen feature audit</text>
  <text class="boxText" x="116" y="852">Spatial bone information · cross-view retrieval</text>
  <text class="boxText" x="116" y="877">Representation non-collapse</text>

  <rect x="96" y="936" width="378" height="118" rx="13" fill="#dfeaf6" stroke="#afc5dc"/>
  <text class="output" x="116" y="965">PHASE OUTPUT</text>
  <text class="boxText" x="116" y="992">Best validation-loss P1 and P2 checkpoints</text>
  <text class="boxText" x="116" y="1017">with recorded PASS / WARN audit evidence</text>
  <text class="smallBold" x="116" y="1041">No test-subject exposure</text>

  <!-- Phase II -->
  <rect class="node" x="546" y="390" width="378" height="92" rx="13"/>
  <text class="boxTitle" x="566" y="420">Neutral supervised adaptation</text>
  <text class="boxText" x="566" y="446">Encoder + fusion + lift + temporary head</text>
  <text class="small" x="566" y="467">Weighted BCE–soft Dice supervision</text>

  <path class="arrowBlue" d="M735 482 V508"/>

  <rect class="node" x="546" y="510" width="378" height="200" rx="13"/>
  <text class="boxTitle" x="566" y="540">Multiscale AP/LAT feature fusion</text>

  <rect x="566" y="562" width="158" height="52" rx="10" fill="#e8eef7" stroke="#b8cbe1"/>
  <text class="smallBold" x="645" y="582" text-anchor="middle">64 × 64</text>
  <text class="small" x="645" y="601" text-anchor="middle">Local bidirectional</text>

  <rect x="746" y="562" width="158" height="52" rx="10" fill="#e8eef7" stroke="#b8cbe1"/>
  <text class="smallBold" x="825" y="582" text-anchor="middle">32 × 32</text>
  <text class="small" x="825" y="601" text-anchor="middle">Local bidirectional</text>

  <rect x="566" y="630" width="158" height="52" rx="10" fill="#e8eef7" stroke="#b8cbe1"/>
  <text class="smallBold" x="645" y="650" text-anchor="middle">16 × 16</text>
  <text class="small" x="645" y="669" text-anchor="middle">Cross-attention</text>

  <rect x="746" y="630" width="158" height="52" rx="10" fill="#e8eef7" stroke="#b8cbe1"/>
  <text class="smallBold" x="825" y="650" text-anchor="middle">8 × 8</text>
  <text class="small" x="825" y="669" text-anchor="middle">Cross-attention</text>
  <text class="small" x="735" y="700" text-anchor="middle">Fine local anatomy + deeper global correspondence</text>

  <path class="arrowBlue" d="M735 710 V738"/>

  <rect class="node" x="546" y="740" width="378" height="128" rx="13"/>
  <text class="boxTitle" x="566" y="770">Geometry-locked orthogonal lift</text>
  <text class="boxText" x="566" y="796">AP and oriented LAT features broadcast</text>
  <text class="boxText" x="566" y="821">along their corresponding LPS world axes</text>
  <text class="small" x="566" y="846">Combined into a 3D pyramid by 3D convolutions</text>

  <path class="arrowBlue" d="M735 868 V896"/>

  <rect x="546" y="898" width="378" height="156" rx="13" fill="#dfeaf6" stroke="#afc5dc"/>
  <text class="output" x="566" y="927">PHASE OUTPUT</text>
  <text class="boxTitle" x="566" y="955">Shared fold-specific front end</text>
  <text class="boxText" x="566" y="981">Select best validation macro Dice</text>
  <text class="boxText" x="566" y="1006">Discard temporary neutral head</text>
  <text class="smallBold" x="566" y="1032">Freeze encoder + fusion + lift</text>

  <!-- Phase III -->
  <rect class="node" x="996" y="390" width="378" height="92" rx="13"/>
  <text class="boxTitle" x="1016" y="420">Decoder capacity and resume gate</text>
  <text class="boxText" x="1016" y="446">Learnability · memory · checkpoint recovery</text>
  <text class="small" x="1016" y="467">Evaluated with frozen cached front-end features</text>

  <path class="arrow" d="M1185 482 V510"/>

  <rect class="node" x="996" y="512" width="378" height="288" rx="13"/>
  <text class="boxTitle" x="1016" y="542">Controlled 2 × 2 decoder design</text>
  <text class="small" x="1016" y="565">Only residual topology and activation differ</text>

  <text class="smallBold" x="1142" y="598" text-anchor="middle">ReLU</text>
  <text class="smallBold" x="1288" y="598" text-anchor="middle">PReLU</text>
  <text class="smallBold" x="1030" y="651">Plain</text>
  <text class="smallBold" x="1012" y="727">Residual</text>

  <rect x="1070" y="612" width="142" height="62" rx="10"  fill="#f2edf8" stroke="#8f7aad" stroke-width="2"/>
  <text class="smallBold" x="1141" y="638" text-anchor="middle">U-Style baseline</text>
  <text class="small" x="1141" y="658" text-anchor="middle">Plain + ReLU</text>

  <rect x="1222" y="612" width="142" height="62" rx="10" fill="#f2edf8" stroke="#c0b1d8"/>
  <text class="smallBold" x="1293" y="638" text-anchor="middle">Diagnostic arm</text>
  <text class="small" x="1293" y="658" text-anchor="middle">Plain + PReLU</text>

  <rect x="1070" y="688" width="142" height="62" rx="10" fill="#f2edf8" stroke="#c0b1d8"/>
  <text class="smallBold" x="1141" y="714" text-anchor="middle">Diagnostic arm</text>
  <text class="small" x="1141" y="734" text-anchor="middle">Residual + ReLU</text>

  <rect x="1222" y="688" width="142" height="62" rx="10" fill="#e8e2f2" stroke="#8f7aad" stroke-width="2"/>
  <text class="smallBold" x="1293" y="714" text-anchor="middle">V-Style baseline</text>
  <text class="small" x="1293" y="734" text-anchor="middle">Residual + PReLU</text>

  <text class="small" x="1185" y="781" text-anchor="middle">Same channels · upsampling · normalisation · loss</text>

  <path class="arrow" d="M1185 800 V828"/>

  <rect class="node" x="996" y="830" width="378" height="118" rx="13"/>
  <text class="boxTitle" x="1016" y="860">Matched five-fold optimisation</text>
  <text class="boxText" x="1016" y="886">Shared front end remains frozen</text>
  <text class="boxText" x="1016" y="911">Only decoder parameters are updated</text>
  <text class="small" x="1016" y="934">Identical training conditions across all arms</text>

  <rect x="996" y="974" width="378" height="80" rx="13" fill="#ebe6f4" stroke="#c0b1d8"/>
  <text class="output" x="1016" y="1003">PHASE OUTPUT</text>
  <text class="boxText" x="1016" y="1030">20 selected checkpoints + held-out predictions</text>

  <!-- Phase IV -->
  <rect class="node" x="1446" y="390" width="458" height="100" rx="13"/>
  <text class="boxTitle" x="1466" y="420">Out-of-fold reconstruction</text>
  <text class="boxText" x="1466" y="446">Each knee predicted only by its held-out fold model</text>
  <text class="small" x="1466" y="471">71 OOF knees per decoder arm</text>

  <path class="arrow" d="M1675 490 V520"/>

  <rect class="node" x="1446" y="522" width="458" height="122" rx="13"/>
  <text class="boxTitle" x="1466" y="552">Paired subject-level comparison</text>
  <text class="boxText" x="1466" y="578">43 subject-level analysis records</text>
  <text class="boxText" x="1466" y="603">Identical cases compared across decoder arms</text>
  <text class="small" x="1466" y="628">No additional model parameters are trained</text>

  <path class="arrow" d="M1675 644 V674"/>

  <rect class="node" x="1446" y="676" width="458" height="176" rx="13"/>
  <text class="boxTitle" x="1466" y="706">Reconstruction assessment</text>

  <rect x="1466" y="728" width="126" height="46" rx="10" fill="#e5f4ec" stroke="#bcdcca"/>
  <text class="smallBold" x="1529" y="756" text-anchor="middle">Dice overlap</text>

  <rect x="1604" y="728" width="126" height="46" rx="10" fill="#e5f4ec" stroke="#bcdcca"/>
  <text class="smallBold" x="1667" y="756" text-anchor="middle">ASSD surface</text>

  <rect x="1742" y="728" width="142" height="46" rx="10" fill="#e5f4ec" stroke="#bcdcca"/>
  <text class="smallBold" x="1813" y="756" text-anchor="middle">Per-bone results</text>

  <text class="boxText" x="1466" y="807">Healthy and fractured cohort reporting</text>
  <text class="boxText" x="1466" y="832">Bootstrap confidence intervals for paired effects</text>

  <path class="arrow" d="M1675 852 V882"/>

  <rect x="1446" y="884" width="458" height="170" rx="13" fill="#dff1e7" stroke="#aad3bd"/>
  <text class="output" x="1466" y="913">FINAL OUTPUT</text>
  <text class="boxTitle" x="1466" y="941">Controlled decoder-effect estimates</text>
  <text class="boxText" x="1466" y="968">U-Net- and V-Net-style baselines compared</text>
  <text class="boxText" x="1466" y="993">under the same encoder, fusion and lift pathway</text>
  <text class="smallBold" x="1466" y="1023">Topology and activation effects remain separable</text>

  <!-- Cross-phase hand-off arrows -->
  <path class="arrowBlue" d="M500 690 H520"/>
  <path class="arrowBlue" d="M950 690 H970"/>
  <path class="arrow" d="M1400 690 H1420"/>

  <!-- Footer legend -->
  <line x1="70" y1="1132" x2="104" y2="1132" stroke="#2474a8" stroke-width="3"/>
  <text class="small" x="114" y="1137">representation and shared-front-end learning</text>
  <line x1="454" y1="1132" x2="488" y2="1132" stroke="#526078" stroke-width="3"/>
  <text class="small" x="498" y="1137">decoder-only optimisation or inference</text>
  <rect x="810" y="1121" width="42" height="22" rx="6" fill="#ffffff" stroke="#cfd8e5"/>
  <text class="small" x="862" y="1137">trainable stage</text>
  <rect x="1050" y="1121" width="42" height="22" rx="6" fill="#dfeaf6" stroke="#afc5dc"/>
  <text class="small" x="1102" y="1137">selected or frozen output</text>
  <text class="smallBold" x="1930" y="1137" text-anchor="end">One independent pipeline per fold</text>
</svg>
